<!DOCTYPE html>
<!--
  ============================================================================
  tao-thiep.html  -  TRANG TẠO LINK LỜI CHÚC
  ----------------------------------------------------------------------------
  Dành cho người muốn gửi lời chúc: điền tên người nhận, lời nhắn riêng, tên
  mình, rồi nhận về một đường link. Người nhận mở link sẽ thấy thiệp có tên và
  lời nhắn đó. KHÔNG cần sửa file nào trên GitHub.

  Cách hoạt động (rất đơn giản): trang chỉ ghép các ô bạn điền vào cuối đường link,
  ví dụ  index.html?ten=Lan&loi=Chúc em vui&tu=Minh . Khi người nhận mở link,
  main.js (trong index.html) đọc phần sau dấu "?" và điền vào tấm thiệp.
  Không có máy chủ, không lưu dữ liệu ở đâu cả.

  File này tự chứa cả giao diện (CSS) lẫn mã (JS) ở bên dưới để dễ đọc từ trên xuống.
  ============================================================================
-->
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02050c">
<meta name="robots" content="noindex">
<title>Tạo lời chúc 20/10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Lora:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
/* ---------- GIAO DIỆN (CSS) ---------- */

/* Quy tắc chung: tính kích thước gồm cả viền, bỏ lề mặc định */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}

/* Nền đêm giống trang chính; padding chừa chỗ cho tai thỏ / thanh điều hướng điện thoại */
body{min-height:100vh;min-height:100dvh;background:radial-gradient(ellipse at 50% 0%,#12304a 0%,#08111f 55%,#02050c 100%);color:#f4efe6;font-family:'Be Vietnam Pro',system-ui,sans-serif;padding:max(24px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom));display:flex;justify-content:center}

/* Khối nội dung chính: rộng tối đa 560px, các phần xếp dọc cách nhau 22px */
main{width:min(560px,100%);display:flex;flex-direction:column;gap:22px;padding-top:4vh}

h1{font-family:'Lora',Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(30px,8vw,44px);color:#fff3dd;line-height:1.15}
.sub{color:#c4cddb;font-size:16px;line-height:1.7}
label{display:block;font-size:15px;font-weight:600;margin-bottom:8px}
.opt{font-weight:400;color:#9fabbd}

/* Ô nhập chữ: cỡ chữ 16px để iPhone không tự phóng to trang khi bấm vào ô */
input,textarea{width:100%;border-radius:14px;border:1.5px solid rgba(244,239,230,.3);background:#13233a;color:#f4efe6;font:inherit;font-size:16px;padding:14px 16px}
textarea{min-height:120px;resize:vertical;line-height:1.6}

/* Viền vàng khi chọn bằng bàn phím (giúp người dùng biết đang ở ô nào) */
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #f6d77a;outline-offset:3px}

/* Khung chứa link kết quả */
.box{background:rgba(255,150,200,.08);border:1px solid rgba(255,190,220,.35);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.box input{font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:12px}

/* Nút bấm: .p = nút chính (vàng), .s = nút phụ (viền) */
.btn{min-height:48px;padding:0 24px;border-radius:999px;border:0;font:inherit;font-size:16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}
.p{background:#f6d77a;color:#1b2433}
.s{background:transparent;color:#f4efe6;border:1.5px solid rgba(244,239,230,.4)}
.note{color:#9fabbd;font-size:14px;line-height:1.7}
.ok{color:#9be8c1;font-size:14px;min-height:20px}
</style>
</head>
<body>
<!-- ---------- NỘI DUNG (HTML) ---------- -->
<main>
  <h1>Tạo lời chúc 20/10</h1>
  <p class="sub">Điền vài dòng, nhận một đường link, rồi gửi cho người bạn muốn chúc. Tất cả đều không bắt buộc.</p>

  <!-- Ô 1: tên người nhận -> sẽ thành tham số "ten" trong link -->
  <div>
    <label for="ten">Tên người nhận <span class="opt">(hiện trong thiệp)</span></label>
    <input id="ten" maxlength="30" placeholder="Ví dụ: Lan, cô Hạnh, chị Mai" autocomplete="off">
  </div>

  <!-- Ô 2: lời nhắn riêng -> tham số "loi" -->
  <div>
    <label for="loi">Lời nhắn riêng của bạn <span class="opt">(tối đa 300 chữ)</span></label>
    <textarea id="loi" maxlength="300" placeholder="Viết điều bạn muốn nói với người ấy..."></textarea>
  </div>

  <!-- Ô 3: tên người gửi -> tham số "tu" -->
  <div>
    <label for="tu">Tên người gửi <span class="opt">(hiện ở cuối thiệp)</span></label>
    <input id="tu" maxlength="30" placeholder="Ví dụ: Minh" autocomplete="off">
  </div>

  <!-- Khung kết quả: link được tạo tự động mỗi khi bạn gõ -->
  <div class="box">
    <label for="link" style="margin:0">Link để gửi đi</label>
    <input id="link" readonly>
    <div class="row">
      <button class="btn p" id="copy" type="button">Sao chép link</button>
      <a class="btn s" id="try" href="index.html" target="_blank" rel="noopener">Xem thử</a>
    </div>
    <div class="ok" id="ok" role="status"></div>
  </div>

  <p class="note">Lời nhắn nằm ngay trong link, không lưu ở đâu khác, nên ai có link đều đọc được. Link dài là bình thường, bạn gửi qua Zalo hoặc Messenger đều được.</p>
</main>

<script>
/* ---------- PHẦN MÃ (JavaScript) ---------- */
(function () {
  // Lấy các ô và nút trong trang
  var ten = document.getElementById('ten'), loi = document.getElementById('loi'), tu = document.getElementById('tu');
  var link = document.getElementById('link'), tryA = document.getElementById('try'), ok = document.getElementById('ok');

  // BƯỚC 1: tạo link từ những gì đã điền
  function build() {
    // index.html nằm cùng thư mục với trang này; new URL(...) tự ghép đúng địa chỉ
    var u = new URL('index.html', location.href);
    var q = new URLSearchParams();                  // công cụ ghép "tên=giá trị" và tự mã hóa tiếng Việt, ký tự đặc biệt

    // Ô nào có chữ thì mới thêm vào link
    if (ten.value.trim()) q.set('ten', ten.value.trim());
    if (loi.value.trim()) q.set('loi', loi.value.trim());
    if (tu.value.trim())  q.set('tu',  tu.value.trim());

    u.search = q.toString();                        // gắn phần "?ten=...&loi=..." vào cuối link
    link.value = u.href;                            // hiện link trong ô kết quả
    tryA.href = u.href;                             // nút "Xem thử" mở đúng link này
    ok.textContent = '';                            // xóa thông báo cũ
  }

  // Mỗi lần gõ chữ vào một ô thì tạo lại link
  [ten, loi, tu].forEach(function (el) { el.addEventListener('input', build); });

  // BƯỚC 2: nút "Sao chép link"
  document.getElementById('copy').addEventListener('click', function () {
    var done = function (good) {
      ok.textContent = good ? 'Đã sao chép link.' : 'Chưa sao chép được, hãy nhấn giữ vào ô link rồi chọn Sao chép.';
    };
    link.select();                                  // bôi đen link (phòng khi cần sao chép tay)
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link.value).then(function () { done(true); }, function () { done(false); });
    } else {
      try { done(document.execCommand('copy')); } catch (e) { done(false); }   // cách cũ cho trình duyệt đời cũ
    }
  });

  build();                                          // tạo link lần đầu (lúc chưa điền gì)
})();
</script>
</body>
</html>
